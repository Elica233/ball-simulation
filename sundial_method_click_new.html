  &lt;script&gt;
    // --- 状态管理 ---
    let currentData = null; // 当前模拟的数据 {date, length}
    let records = []; // 历史记录
    let chartInstance = null;

    // --- 核心算法 ---
    function isLeapYear(year) {
      return (year % 4 === 0 &amp;&amp; year % 100 !== 0) || (year % 400 === 0);
    }

    function getDayOfYear(year, month, day) {
      const daysInMonths = [0, 31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
      if (isLeapYear(year)) daysInMonths[2] = 29;
      
      let dayOfYear = 0;
      for(let i=1; i&lt;month; i++) dayOfYear += daysInMonths[i];
      dayOfYear += day;
      return dayOfYear;
    }

    function calculateShadow(year, month, day) {
      const dayOfYear = getDayOfYear(year, month, day);
      const totalDays = isLeapYear(year) ? 366 : 365;
      
      // 模拟算法：冬至(12.22)最长，夏至(6.22)最短
      // 12.22 约为第 356 天 (平年)
      // 构造 cos 函数，峰值在 356
      // rad = (day - 356) * (2PI / 365)
      // cos(0) = 1 (最大值)
      
      // 修正偏移量：让 12.22 对应 0 度
      // 12.22 是第 356 天。
      // 偏移量 offset = 356
      const offset = isLeapYear(year) ? 357 : 356;
      const rad = (dayOfYear - offset) * (2 * Math.PI / totalDays);
      
      // 长度范围 30 - 320
      const length = 175 + 145 * Math.cos(rad);
      
      // 计算太阳高度角 (用于UI显示)
      // 影长 L = H * cot(h) -&gt; cot(h) = L/H -&gt; tan(h) = H/L
      // 假设表高 H = 100cm (比例尺)
      const angleRad = Math.atan(100 / length);
      const angleDeg = angleRad * (180 / Math.PI);
      
      return { length, angleDeg };
    }

    // --- UI 更新 ---
    // const simulateBtn = document.getElementById('simulateBtn'); // 已移除
    const recordBtn = document.getElementById('recordBtn');
    const resultDisplay = document.getElementById('resultDisplay');
    const shadowEl = document.getElementById('shadow');
    const shadowTip = document.getElementById('shadowTip');
    const shadowTipText = document.getElementById('shadowTipText');
    const sunEl = document.getElementById('sun');
    const lightRay = document.getElementById('lightRay');
    const daysContainer = document.getElementById('daysContainer');
    
    // 固定年份
    const FIXED_YEAR = 2025;

    // 处理月份输入
    window.handleMonthInput = function(val) {
      const month = parseInt(val);
      daysContainer.innerHTML = '';

      if (!month || month &lt; 1 || month &gt; 12) {
        daysContainer.innerHTML = '&lt;div class=&quot;col-span-5 text-center text-gray-400 text-sm py-4 italic&quot;&gt;请输入有效的月份 (1-12)&lt;/div&gt;';
        return;
      }

      // 获取该月天数
      const daysInMonth = new Date(FIXED_YEAR, month, 0).getDate();
      
      // 生成按钮
      for (let d = 1; d &lt;= daysInMonth; d++) {
        const btn = document.createElement('button');
        btn.className = 'p-1.5 text-xs font-bold border border-gray-200 rounded hover:bg-primary hover:text-white transition-colors bg-white text-gray-700';
        btn.innerText = `${d}日`;
        btn.onclick = () =&gt; simulateDay(month, d, btn);
        daysContainer.appendChild(btn);
      }
    };

    // 模拟指定日期
    function simulateDay(month, day, btnElement) {
      // 样式选中状态
      if (btnElement) {
        const allBtns = daysContainer.querySelectorAll('button');
        allBtns.forEach(b =&gt; {
          b.classList.remove('bg-primary', 'text-white', 'ring-2', 'ring-offset-1', 'ring-primary');
          b.classList.add('bg-white', 'text-gray-700');
        });
        btnElement.classList.remove('bg-white', 'text-gray-700');
        btnElement.classList.add('bg-primary', 'text-white', 'ring-2', 'ring-offset-1', 'ring-primary');
      }

      const res = calculateShadow(FIXED_YEAR, month, day);
      currentData = { 
        year: FIXED_YEAR, 
        month, 
        day, 
        length: res.length,
        dateObj: new Date(FIXED_YEAR, month - 1, day)
      };

      // 渲染场景
      renderScene(res.length, res.angleDeg);

      // 激活记录按钮
      recordBtn.disabled = false;
      recordBtn.innerHTML = '&lt;span&gt;📝&lt;/span&gt; 记录此数据';
      recordBtn.classList.remove('bg-gray-300', 'cursor-not-allowed', 'bg-green-600', 'hover:bg-green-700');
      recordBtn.classList.add('bg-accent', 'hover:bg-red-700', 'shadow-lg');
    }

    // 渲染场景核心逻辑
    function renderScene(length, angleDeg) {
      // 更新显示数值
      resultDisplay.innerText = `${length.toFixed(1)} cm`;

      // 动画更新
      // 1. 太阳位置
      const sunBottom = 20 + (angleDeg / 90) * 60;
      anime({
        targets: sunEl,
        bottom: `${sunBottom}%`,
        duration: 800,
        easing: 'easeOutQuad',
        update: function() {
           updateLightRay();
        }
      });

      // 2. 影子长度
      const maxLen = 350;
      const widthPercent = (length / maxLen) * 100;
      
      shadowEl.style.width = `${Math.min(widthPercent, 100)}%`;
      
      // 3. 标记点位置
      shadowTip.style.left = `calc(1.3rem + ${Math.min(widthPercent, 100)}%)`;
      shadowTip.style.opacity = 1;
      
      // 更新标记点数值
      shadowTipText.innerText = `${length.toFixed(1)} cm`;
      
      // 立即更新一次光线
      setTimeout(updateLightRay, 50);
    }

    // 回看历史记录
    window.restoreView = function(index) {
      const item = records[index];
      if (!item) return;
      
      // 计算角度 (需要重新计算，因为记录里只存了长度)
      // 反推角度: tan(h) = H/L = 100/L
      const angleRad = Math.atan(100 / item.length);
      const angleDeg = angleRad * (180 / Math.PI);
      
      renderScene(item.length, angleDeg);
      
      // 更新按钮状态为&ldquo;已记录&rdquo;
      recordBtn.disabled = true;
      recordBtn.innerHTML = '&lt;span&gt;✅&lt;/span&gt; 已记录数据';
      recordBtn.classList.remove('bg-accent', 'hover:bg-red-700', 'shadow-lg');
      recordBtn.classList.add('bg-green-600', 'text-white', 'cursor-default');
      
      // 如果当前月份面板正好是该记录的月份，高亮对应按钮
      const currentMonthInput = document.getElementById('monthInput').value;
      if (parseInt(currentMonthInput) === item.month) {
         const allBtns = daysContainer.querySelectorAll('button');
         allBtns.forEach(b =&gt; {
            if (b.innerText === `${item.day}日`) {
               b.classList.remove('bg-white', 'text-gray-700');
               b.classList.add('bg-primary', 'text-white', 'ring-2', 'ring-offset-1', 'ring-primary');
            } else {
               b.classList.remove('bg-primary', 'text-white', 'ring-2', 'ring-offset-1', 'ring-primary');
               b.classList.add('bg-white', 'text-gray-700');
            }
         });
      }
    };
    
    // 更新光线辅助线
    function updateLightRay() {
       const sunRect = sunEl.getBoundingClientRect();
       const tipRect = shadowTip.getBoundingClientRect();
       const containerRect = sunEl.parentElement.getBoundingClientRect();
       
       // 相对容器的坐标
       const x1 = sunRect.left + sunRect.width/2 - containerRect.left;
       const y1 = sunRect.top + sunRect.height/2 - containerRect.top;
       const x2 = tipRect.left + tipRect.width/2 - containerRect.left;
       const y2 = tipRect.top + tipRect.height - containerRect.top; // 指向箭头底部
       
       const length = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
       const angle = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
       
       lightRay.style.width = `${length}px`;
       lightRay.style.left = `${x1}px`;
       lightRay.style.top = `${y1}px`;
       lightRay.style.transform = `rotate(${angle}deg)`;
    }

    /* 已移除旧的 simulateBtn 事件监听 */

    // --- 数据记录 ---
    recordBtn.addEventListener('click', () =&gt; {
      if (!currentData) return;
      
      // 添加到记录
      records.push(currentData);
      
      // 更新表格
      updateTable();
      
      // 更新图表
      updateChart();
      
      // 禁用按钮防止重复
      recordBtn.disabled = true;
      recordBtn.classList.add('bg-gray-300', 'cursor-not-allowed');
      recordBtn.classList.remove('bg-accent', 'hover:bg-red-700', 'shadow-lg');
    });

    function updateTable() {
      const tbody = document.getElementById('recordTableBody');
      if (records.length === 1) tbody.innerHTML = ''; // 清除空提示
      
      const item = records[records.length - 1];
      const index = records.length - 1;
      
      const tr = document.createElement('tr');
      tr.className = 'bg-white border-b hover:bg-blue-50 transition-colors cursor-pointer group';
      tr.onclick = () =&gt; restoreView(index);
      tr.innerHTML = `
        &lt;td class=&quot;px-6 py-4 font-medium text-gray-900 group-hover:text-primary&quot;&gt;${index + 1}&lt;/td&gt;
        &lt;td class=&quot;px-6 py-4&quot;&gt;${item.year}年${item.month}月${item.day}日&lt;/td&gt;
        &lt;td class=&quot;px-6 py-4 text-right font-mono font-bold text-primary&quot;&gt;${item.length.toFixed(1)}&lt;/td&gt;
        &lt;td class=&quot;px-6 py-4 text-center&quot;&gt;
          &lt;button onclick=&quot;event.stopPropagation(); deleteRecord(${index})&quot; class=&quot;text-red-600 hover:text-red-900 text-xs font-bold border border-red-200 px-2 py-1 rounded hover:bg-red-50&quot;&gt;删除&lt;/button&gt;
        &lt;/td&gt;
      `;
      
      // 插入到第一行 (倒序显示)
      tbody.insertBefore(tr, tbody.firstChild);
    }

    window.deleteRecord = function(index) {
      records.splice(index, 1);
      // 重绘所有
      const tbody = document.getElementById('recordTableBody');
      tbody.innerHTML = '';
      if (records.length === 0) {
        tbody.innerHTML = '&lt;tr id=&quot;emptyRow&quot;&gt;&lt;td colspan=&quot;4&quot; class=&quot;px-6 py-8 text-center text-gray-400 italic&quot;&gt;暂无观测数据，请在左侧进行模拟&lt;/td&gt;&lt;/tr&gt;';
      } else {
        // 重新渲染所有行以更新序号
        records.forEach((item, idx) =&gt; {
           const tr = document.createElement('tr');
           tr.className = 'bg-white border-b hover:bg-blue-50 transition-colors cursor-pointer group';
           tr.onclick = () =&gt; restoreView(idx);
           tr.innerHTML = `
             &lt;td class=&quot;px-6 py-4 font-medium text-gray-900 group-hover:text-primary&quot;&gt;${idx + 1}&lt;/td&gt;
             &lt;td class=&quot;px-6 py-4&quot;&gt;${item.year}年${item.month}月${item.day}日&lt;/td&gt;
             &lt;td class=&quot;px-6 py-4 text-right font-mono font-bold text-primary&quot;&gt;${item.length.toFixed(1)}&lt;/td&gt;
             &lt;td class=&quot;px-6 py-4 text-center&quot;&gt;
               &lt;button onclick=&quot;event.stopPropagation(); deleteRecord(${idx})&quot; class=&quot;text-red-600 hover:text-red-900 text-xs font-bold border border-red-200 px-2 py-1 rounded hover:bg-red-50&quot;&gt;删除&lt;/button&gt;
             &lt;/td&gt;
           `;
           tbody.insertBefore(tr, tbody.firstChild);
        });
      }
      updateChart();
    };

    // --- 图表初始化 ---
    const ctx = document.getElementById('scatterChart').getContext('2d');
    chartInstance = new Chart(ctx, {
      type: 'scatter',
      data: {
        datasets: [{
          label: '观测记录',
          data: [],
          backgroundColor: '#DC2626',
          borderColor: '#DC2626',
          pointRadius: 6,
          pointHoverRadius: 8
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: {
            type: 'time',
            time: {
              unit: 'month',
              displayFormats: {
                month: 'yyyy-MM'
              },
              tooltipFormat: 'yyyy-MM-dd'
            },
            title: { display: true, text: '观测日期' }
          },
          y: {
            beginAtZero: false,
            title: { display: true, text: '影长 (cm)' }
          }
        },
        plugins: {
          tooltip: {
            callbacks: {
              label: function(context) {
                const date = new Date(context.parsed.x);
                const dateStr = `${date.getFullYear()}-${date.getMonth()+1}-${date.getDate()}`;
                return `${dateStr}: ${context.parsed.y.toFixed(1)} cm`;
              }
            }
          }
        }
      }
    });

    function updateChart() {
      const dataPoints = records.map(r =&gt; ({
        x: r.dateObj,
        y: r.length
      }));
      
      // 按时间排序
      dataPoints.sort((a, b) =&gt; a.x - b.x);
      
      chartInstance.data.datasets[0].data = dataPoints;
      chartInstance.update();
    }

  &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;" frameborder="0">
    </iframe>

  </div>


  <script>

    function getIsMobile() {
      const width = document.documentElement.clientWidth
      const isMobile = /Android|webOS|iPhone|iPod|BlackBerry|iPad|Windows Phone|Mobile/i.test(navigator.userAgent) || width <= 768
      return isMobile
    }

    // ==================== 埋点相关代码 ====================

    /**
     * 页面停留时长统计
     */
    (function () {
      let startTime = null
      let totalTime = 0
      let reportTimer = null // 防抖定时器

      // 开始计时
      function startTimer() {
        if (!startTime) {
          startTime = Date.now()
          console.log('[埋点] 开始计时')
        }
      }

      // 停止计时并累加时长
      function stopTimer() {
        if (startTime) {
          totalTime += Date.now() - startTime
          startTime = null
          console.log('[埋点] 停止计时，累计时长:', Math.floor(totalTime / 1000), '秒')
        }
      }

      // 检查页面是否真正可见
      function isPageVisible() {
        // 检查 document.hidden
        if (document.hidden) {
          return false
        }

        // 检查 document.visibilityState
        if (document.visibilityState && document.visibilityState !== 'visible') {
          return false
        }

        // 检查窗口是否有焦点
        if (!document.hasFocus()) {
          return false
        }

        return true
      }

      // 上报停留时长（带防抖）
      function reportStayTime(eventType, immediate = false) {
        stopTimer()

        // 清除之前的定时器
        if (reportTimer) {
          clearTimeout(reportTimer)
          reportTimer = null
        }

        // 如果是立即上报（如页面卸载），不使用防抖
        if (immediate) {
          doReport(eventType)
          return
        }

        // 使用防抖，避免短时间内多次上报
        // 100ms 内如果有多个事件触发，只上报最后一次
        reportTimer = setTimeout(function () {
          doReport(eventType)
          reportTimer = null
        }, 100)
      }

      // 实际执行上报
      function doReport(eventType) {
        if (window.frog && totalTime > 0) {
          const serverData = window.__SERVER_DATA__ || {}
          const chatId = serverData.watermarkChatId
          window.frog.add({
            url: '/time/HtmlPage/enter',
            eventId: 42818,
            customExtend: {
              chat_id: chatId,
              use_time: Math.floor(totalTime / 1000), // 转换为秒
            },
            duration: Math.floor(totalTime / 1000), // 转换为秒,
            currentPage: 'HtmlPage',
            eventAction: 'time',
            eventName: 'enter'
          })
          console.log(`[埋点] 页面停留时长上报 (${eventType}):`, Math.floor(totalTime / 1000), '秒')

          // 上报后重置累计时长，为下次统计做准备
          totalTime = 0
        }
      }

      // 清理函数：移除所有事件监听器
      function cleanup() {
        console.log('[埋点] 清理计时器资源')

        // 清除防抖定时器
        if (reportTimer) {
          clearTimeout(reportTimer)
          reportTimer = null
        }

        // 移除事件监听器
        document.removeEventListener('visibilitychange', handleVisibilityChange)
        window.removeEventListener('blur', handleBlur)
        window.removeEventListener('focus', handleFocus)
        window.removeEventListener('beforeunload', handleBeforeUnload)
        window.removeEventListener('pagehide', handlePageHide)

        // 重置变量
        startTime = null
        totalTime = 0
      }

      // 事件处理函数（需要命名以便移除）
      function handleVisibilityChange() {
        if (document.hidden) {
          // 页面不可见，停止计时并上报
          console.log('[埋点] visibilitychange - 页面隐藏')
          reportStayTime('visibilitychange')
        } else {
          // 页面可见，开始新的计时
          console.log('[埋点] visibilitychange - 页面显示，开始新的计时')
          startTimer()
        }
      }

      function handleBlur() {
        // 窗口失去焦点，停止计时并上报
        console.log('[埋点] blur - 窗口失去焦点')
        reportStayTime('blur')
      }

      function handleFocus() {
        // 窗口获得焦点，开始新的计时
        console.log('[埋点] focus - 窗口获得焦点，开始新的计时')
        startTimer()
      }

      function handleBeforeUnload() {
        // 页面卸载前立即上报（不使用防抖）
        console.log('[埋点] beforeunload - 页面即将卸载')
        reportStayTime('beforeunload', true)
        cleanup()
      }

      function handlePageHide() {
        // 页面隐藏时立即上报（iOS Safari 更可靠，不使用防抖）
        console.log('[埋点] pagehide - 页面隐藏')
        reportStayTime('pagehide', true)
      }

      function handleDOMContentLoaded() {
        if (isPageVisible()) {
          startTimer()
        }
      }

      // 监听页面可见性变化
      document.addEventListener('visibilitychange', handleVisibilityChange)

      // 监听窗口失去/获得焦点
      window.addEventListener('blur', handleBlur)
      window.addEventListener('focus', handleFocus)

      // 页面加载完成后开始计时
      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', handleDOMContentLoaded)
      } else {
        if (isPageVisible()) {
          startTimer()
        }
      }

      // 页面卸载时上报
      window.addEventListener('beforeunload', handleBeforeUnload)

      // 兼容性：监听 pagehide 事件（iOS Safari 更可靠）
      window.addEventListener('pagehide', handlePageHide)
    })()

    // ==================== 原有功能代码 ====================

    function adjustRem() {
      const pcBaseWidth = 375 // 设计稿
      const width = document.documentElement.clientWidth
      document.documentElement.style.fontSize = `${(width / pcBaseWidth * 100).toFixed(2)}px`
    }

    function checkAndHideButtonOnMobile() {
      const isMobile = getIsMobile()
      if (isMobile) {
        adjustRem()
      }
      const iframeContainer = document.querySelector('.iframe-container');

      if (iframeContainer) {
        if (isMobile) {
          iframeContainer.classList.add('mobile');
        } else {
          iframeContainer.classList.remove('mobile');
        }
      }
    }

    function handleResize() {
      checkAndHideButtonOnMobile();
      const isMobile = getIsMobile()
      const iframeContainer = document.querySelector('.iframe-container');
      if (iframeContainer) {
        if (isMobile) {
          iframeContainer.classList.add('mobile');
        } else {
          iframeContainer.classList.remove('mobile');
        }
      }
    }

    window.addEventListener('resize', handleResize);
    document.addEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);

    function clearAllEvents() {
      window.removeEventListener('resize', handleResize);
      document.removeEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);
    }
    window.addEventListener('beforeunload', clearAllEvents);

  </script>
