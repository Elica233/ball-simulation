    // --- 核心算法 ---
    function calculateDailyShadow(month, day) {
      let dayOfYear = 0;
      const daysInMonths = [0, 31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
      for(let i=1; i&lt;month; i++) dayOfYear += daysInMonths[i];
      dayOfYear += day;
      
      const rad = (dayOfYear + 10) * (2 * Math.PI / 365);
      const length = 175 + 145 * Math.cos(rad);
      
      return { length, dayOfYear };
    }

    // --- 初始化数据 ---
    const daysInMonths = [0, 31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];

    const totalDays = daysPerYear * totalYears;
    
    const labels = []; // 不再使用 labels，改用 linear 轴
    const fullData = []; 
    const displayData = new Array(totalDays).fill(null); 
    
    // 特殊点数据缓存 (只存储有效点)
    const winterPoints = [];
    const summerPoints = [];
    const springPoints = [];
    const autumnPoints = [];
    
    let dayCount = 0;
    
    // 生成2年数据 (2024, 2025)
    for (let year = 1; year &lt;= totalYears; year++) {
      const yearLabel = 2023 + year; // 2024, 2025
      
      for (let m = 1; m &lt;= 12; m++) {
        for (let d = 1; d &lt;= daysInMonths[m]; d++) {
          const res = calculateDailyShadow(m, d);
          fullData.push(res.length);
          
          // 记录特殊点 (使用 {x, y} 格式)
          if (m === 3 &amp;&amp; d === 21) springPoints.push({x: dayCount, y: res.length});
          if (m === 6 &amp;&amp; d === 22) summerPoints.push({x: dayCount, y: res.length});
          if (m === 9 &amp;&amp; d === 23) autumnPoints.push({x: dayCount, y: res.length});
          if (m === 12 &amp;&amp; d === 22) winterPoints.push({x: dayCount, y: res.length});
          
          dayCount++;
        }
      }
    }

    // 计算极值用于辅助线
    const maxLen = calculateDailyShadow(12, 22).length;
    const minLen = calculateDailyShadow(6, 22).length;
    const midLen = (maxLen + minLen) / 2;

    let isFocusMode = false;

            }
          },
          datalabels: { display: false },
          annotation: {
            annotations: {
              line1: {
                type: 'line',

                borderColor: 'rgba(0, 0, 0, 0.2)',

                type: 'line',

                borderDash: [5, 5],
                display: false,
                label: {
                  display: true,
                  content: '二分影长',
                  position: 'start',
                  backgroundColor: 'rgba(168, 85, 247, 0.7)',
                  font: { size: 10 }
                }
              }

              maxRotation: 0, 
              autoSkip: false, 
              callback: function(val, index) {
                const yearIndex = Math.floor(val / 365);
                const currentYear = 2024 + yearIndex;
                const dayOfYear = val % 365;
                
                let m = 1;
                let dCount = 0;
                while (m &lt;= 12 &amp;&amp; dayOfYear &gt;= dCount + daysInMonths[m]) {
                  dCount += daysInMonths[m];
                  m++;
                }
                const day = dayOfYear - dCount + 1;
                
                if (day !== 1) return '';
                
                const label = `${currentYear}年${m}月`;
                
                if (isFocusMode) {
                   if (m === 1) return label;
                   return `${m}月`;
                }
                
                if (m === 1 || m === 7) return label;
                return '';
              }
            }
          },
          y: {
            min: 0, max: 350,

    // --- 交互逻辑 ---
    const btnContainer = document.getElementById('monthGrid');
    const monthStatus = new Array(13).fill(false);

    for (let m = 1; m &lt;= 12; m++) {
      const btn = document.createElement('button');
      btn.className = 'btn-month bg-white border border-gray-300 text-gray-600 py-2 rounded-lg font-bold text-sm hover:border-primary hover:text-primary';
      btn.innerText = `${m}月`;
      btn.onclick = () =&gt; toggleMonth(m, btn);
      btnContainer.appendChild(btn);
    }

    function toggleMonth(month, btn) {
      const isActive = !monthStatus[month];
      monthStatus[month] = isActive;
      
      if (isActive) {
        btn.classList.add('active');
        btn.classList.remove('border-gray-300', 'text-gray-600');
      } else {
        btn.classList.remove('active');
        btn.classList.add('border-gray-300', 'text-gray-600');
      }
      updateChartData();
    }

    function updateChartData() {
      let dataIndex = 0;
      for (let year = 1; year &lt;= totalYears; year++) {
        for (let m = 1; m &lt;= 12; m++) {
          const days = daysInMonths[m];
          for (let d = 1; d &lt;= days; d++) {
            const val = monthStatus[m] ? fullData[dataIndex] : null;
            displayData[dataIndex] = { x: dataIndex, y: val };
            dataIndex++;
          }
        }
      }
      chart.update();
    }

    // 发现功能
    const discoverBtn = document.getElementById('discoverBtn');
    const discoverMenu = document.getElementById('discoverMenu');
    const btnHighPoint = document.getElementById('btnHighPoint');

    const btnAutumnPoint = document.getElementById('btnAutumnPoint');

    discoverBtn.onclick = () =&gt; {

    };

    btnHighPoint.onclick = () =&gt; {
      chart.data.datasets[1].data = winterPoints;
      chart.update();
      if (!monthStatus[12]) toggleMonth(12, btnContainer.children[11]);
    };

    btnLowPoint.onclick = () =&gt; {
      chart.data.datasets[2].data = summerPoints;
      chart.update();
      if (!monthStatus[6]) toggleMonth(6, btnContainer.children[5]);
    };

    btnSpringPoint.onclick = () =&gt; {
      chart.data.datasets[3].data = springPoints;
      chart.update();
      if (!monthStatus[3]) toggleMonth(3, btnContainer.children[2]);
    };

    btnAutumnPoint.onclick = () =&gt; {
      chart.data.datasets[4].data = autumnPoints;
      chart.update();
      if (!monthStatus[9]) toggleMonth(9, btnContainer.children[8]);
    };

    // 弹窗控制
    const infoModal = document.getElementById('infoModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalDesc = document.getElementById('modalDesc');

    function showModal(title, desc) {
      modalTitle.innerText = title;
      modalDesc.innerText = desc;
      infoModal.classList.remove('hidden');
    }

    // 全局控制
    document.getElementById('resetBtn').onclick = () =&gt; {
      monthStatus.fill(false);
      document.querySelectorAll('.btn-month').forEach(btn =&gt; {
        btn.classList.remove('active');
        btn.classList.add('border-gray-300', 'text-gray-600');
      });
      for(let i=1; i&lt;=4; i++) chart.data.datasets[i].data = [];
      chart.data.datasets[5].data = [];
      updateChartData();
    };

    document.getElementById('showAllBtn').onclick = () =&gt; {
      isFocusMode = false;
      monthStatus.fill(true);
      document.querySelectorAll('.btn-month').forEach(btn =&gt; {
        btn.classList.add('active');
        btn.classList.remove('border-gray-300', 'text-gray-600');
      });
      chart.options.scales.x.min = 0;
      chart.options.scales.x.max = totalDays;
      chart.update();
      updateChartData();
    };
    
    document.getElementById('focusBtn').onclick = () =&gt; {
      isFocusMode = true;
      chart.options.scales.x.min = 365;
      chart.options.scales.x.max = 730;
      chart.update();
    };
    
    // 辅助线控制
    function toggleLine(id) {
       const display = chart.options.plugins.annotation.annotations[id].display;
       chart.options.plugins.annotation.annotations[id].display = !display;
       chart.update();
    }
    
    const gridLines = {};
    const step1 = (maxLen - midLen) / 6;
    const step2 = (midLen - minLen) / 6;
    const targetYValues = [];
    
    for(let i=1; i&lt;=5; i++) {
      const y1 = midLen + step1 * i;
      const y2 = midLen - step2 * i;
      targetYValues.push(y1, y2);
      
        gridLines[`grid_upper_${i}`] = {
        type: 'line',
        yMin: y1, yMax: y1,
        borderColor: 'rgba(147, 51, 234, 0.5)',
        borderWidth: 2,
        borderDash: [4, 4],
        display: false
      };
      gridLines[`grid_lower_${i}`] = {
        type: 'line',
        yMin: y2, yMax: y2,
        borderColor: 'rgba(147, 51, 234, 0.5)',
        borderWidth: 2,
        borderDash: [4, 4],
        display: false
      };
    }
    Object.assign(chart.options.plugins.annotation.annotations, gridLines);
    
    document.getElementById('btnLineMax').onclick = () =&gt; toggleLine('lineMax');
    document.getElementById('btnLineMin').onclick = () =&gt; toggleLine('lineMin');
    document.getElementById('btnLineMid').onclick = () =&gt; toggleLine('lineMid');
    
    document.getElementById('btnGridLines').onclick = () =&gt; {
      const isHidden = !chart.options.plugins.annotation.annotations['grid_upper_1'].display;
      
      for(let i=1; i&lt;=5; i++) {
        chart.options.plugins.annotation.annotations[`grid_upper_${i}`].display = isHidden;
        chart.options.plugins.annotation.annotations[`grid_lower_${i}`].display = isHidden;
      }
      
      chart.options.scales.y.grid.display = !isHidden;
      chart.update();
    };
    
    document.getElementById('btnIntersections').onclick = () =&gt; {
      const dataset = chart.data.datasets.find(d =&gt; d.label === '交点');
      if (!dataset) return;
      
      if (dataset.data.length &gt; 0) {
        dataset.data = [];
        chart.update();
        return;
      }
      
      if (!targetYValues || targetYValues.length === 0) {
         const s1 = (maxLen - midLen) / 6;
         const s2 = (midLen - minLen) / 6;
         for(let i=1; i&lt;=5; i++) {
           targetYValues.push(midLen + s1 * i, midLen - s2 * i);
         }
      }
      
      const points = [];
      for (let i = 0; i &lt; fullData.length - 1; i++) {
        const y1 = fullData[i];
        const y2 = fullData[i+1];
        
        targetYValues.forEach(targetY =&gt; {
          if ((y1 &lt;= targetY &amp;&amp; y2 &gt;= targetY) || (y1 &gt;= targetY &amp;&amp; y2 &lt;= targetY)) {
            const fraction = (targetY - y1) / (y2 - y1);
            if (fraction &gt;= 0 &amp;&amp; fraction &lt;= 1) {
               points.push({ x: i + fraction, y: targetY });
            }
          }
        });
      }
      dataset.data = points;
      chart.update();
    };
  &lt;/script&gt;
