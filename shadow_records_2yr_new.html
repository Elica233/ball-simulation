  &lt;script&gt;
    // --- 状态管理 ---
    let currentData = null; // 当前模拟的数据 {date, length}

    let viewingRecordIndex = -1; // 当前正在回看的记录索引

    // --- 核心算法 ---
    function isLeapYear(year) {
      return (year % 4 === 0 &amp;&amp; year % 100 !== 0) || (year % 400 === 0);
    }

    function getDayOfYear(year, month, day) {
      const daysInMonths = [0, 31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
      if (isLeapYear(year)) daysInMonths[2] = 29;
      
      let dayOfYear = 0;
      for(let i=1; i&lt;month; i++) dayOfYear += daysInMonths[i];
      dayOfYear += day;
      return dayOfYear;
    }

    function calculateShadow(year, month, day) {
      // 为了保证两年数据一致（教学演示需求），统一按平年模型计算
      // 3月1日及以后的日期，无论闰年与否，都视为同一个相位
      
      const daysInMonths = [0, 31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
      let dayOfYear = 0;
      
      // 特殊处理闰年2月29日
      if (month === 2 &amp;&amp; day === 29) {
        // 将2月29日视为第 59.5 天 (介于2.28和3.1之间)
        dayOfYear = 31 + 28.5;
      } else {
        for(let i=1; i&lt;month; i++) dayOfYear += daysInMonths[i];
        dayOfYear += day;
      }

      // 统一使用平年参数
      const totalDays = 365;
      // 冬至偏移量 (12.22 约为第 356 天)
      const offset = 356;
      
      const rad = (dayOfYear - offset) * (2 * Math.PI / totalDays);
      
      // 长度范围 30 - 320
      const length = 175 + 145 * Math.cos(rad);
      
      // 计算太阳高度角 (用于UI显示)
      const angleRad = Math.atan(100 / length);
      const angleDeg = angleRad * (180 / Math.PI);
      
      return { length, angleDeg };
    }

    // --- UI 更新 ---
    const recordBtn = document.getElementById('recordBtn');
    const resultDisplay = document.getElementById('resultDisplay');
    const shadowEl = document.getElementById('shadow');
    const shadowTip = document.getElementById('shadowTip');
    const shadowTipText = document.getElementById('shadowTipText');
    const sunEl = document.getElementById('sun');
    const lightRay = document.getElementById('lightRay');
    const dateButtonsContainer = document.getElementById('dateButtonsContainer');
    const dateGrid = document.getElementById('dateGrid');
    
    // 当前年份
    let currentYear = 2024;
    
    // 设置年份
    window.setYear = function(year) {
      currentYear = year;
      // 更新按钮样式
      ['2024', '2025'].forEach(y =&gt; {
        const btn = document.getElementById(`btn${y}`);
        if (parseInt(y) === year) {
          btn.classList.add('bg-primary', 'text-white', 'border-primary');
          btn.classList.remove('bg-white', 'text-gray-600', 'hover:bg-gray-50');
        } else {
          btn.classList.remove('bg-primary', 'text-white', 'border-primary');
          btn.classList.add('bg-white', 'text-gray-600', 'hover:bg-gray-50');
        }
      });
      
      // 刷新日期按钮状态
      updateDateButtonsState();
      
      // 如果已经输入了月份，重新触发计算
      const monthVal = document.getElementById('monthInput').value;
      if (monthVal) {
         // 默认选中1日或保持当前日
         // simulateDay(parseInt(monthVal), 1);
      }
    };

    // 处理月份输入
    window.handleMonthInput = function(val) {
      const month = parseInt(val);
      
      if (!month || month &lt; 1 || month &gt; 12) {
        dateButtonsContainer.classList.add('hidden');
        return;
      }

      // 获取该月天数
      const daysInMonth = new Date(currentYear, month, 0).getDate();
      
      // 生成日期按钮
      generateDateButtons(daysInMonth, month);
      dateButtonsContainer.classList.remove('hidden');
      
      // 默认模拟1日
      simulateDay(month, 1);
    };
    
    // 生成日期按钮
    function generateDateButtons(days, month) {
      dateGrid.innerHTML = '';
      for (let d = 1; d &lt;= days; d++) {
        const btn = document.createElement('button');
        btn.className = 'p-2 text-xs font-bold border rounded hover:bg-gray-100 transition-colors';
        btn.innerText = `${d}日`;
        btn.dataset.day = d;
        btn.onclick = () =&gt; {
          simulateDay(month, d);
          autoRecord();
          updateDateButtonsState();
        };
        dateGrid.appendChild(btn);
      }
      updateDateButtonsState();
    }
    
    // 更新日期按钮状态 (已记录的变色)
    function updateDateButtonsState() {
      const month = parseInt(document.getElementById('monthInput').value);
      if (!month) return;
      
      const buttons = dateGrid.querySelectorAll('button');
      buttons.forEach(btn =&gt; {
        const day = parseInt(btn.dataset.day);
        // 检查是否有记录
        const hasRecord = records.some(r =&gt; 
          r.year === currentYear &amp;&amp; 
          r.month === month &amp;&amp; 
          r.day === day
        );
        
        if (hasRecord) {
          btn.classList.add('bg-green-100', 'text-green-700', 'border-green-300');
          btn.classList.remove('bg-white', 'text-gray-700', 'border-gray-200');
        } else {
          btn.classList.remove('bg-green-100', 'text-green-700', 'border-green-300');
          btn.classList.add('bg-white', 'text-gray-700', 'border-gray-200');
        }
        
        // 高亮当前选中的
        if (currentData &amp;&amp; currentData.year === currentYear &amp;&amp; currentData.month === month &amp;&amp; currentData.day === day) {
           btn.classList.add('ring-2', 'ring-primary', 'ring-offset-1');
        } else {
           btn.classList.remove('ring-2', 'ring-primary', 'ring-offset-1');
        }
      });
    }
    
    // 自动记录当前数据
    function autoRecord() {
      if (!currentData) return;
      
      // 退出回看模式
      viewingRecordIndex = -1;
      document.getElementById('deleteBtn').classList.add('hidden');
      document.getElementById('recordBtn').classList.remove('hidden');
      
      // 检查是否已存在该日期的记录
      const existingIndex = records.findIndex(r =&gt; 
        r.year === currentData.year &amp;&amp; 
        r.month === currentData.month &amp;&amp; 
        r.day === currentData.day
      );
      
      if (existingIndex !== -1) {
        // 更新已有记录
        records[existingIndex].length = currentData.length;
      } else {
        // 添加新记录
        records.push(JSON.parse(JSON.stringify(currentData)));
      }
      
      // 更新UI
      updateCharts();
    }

    // 模拟指定日期
    function simulateDay(month, day) {
      // 退出回看模式
      viewingRecordIndex = -1;
      document.getElementById('deleteBtn').classList.add('hidden');
      document.getElementById('recordBtn').classList.remove('hidden');
      
      // 更新滑杆显示 (已移除)
      // currentDateDisplay.innerText = `${day}日`;
      
      const res = calculateShadow(currentYear, month, day);
      currentData = { 
        year: currentYear, 
        month, 
        day, 
        length: res.length,
        dateObj: new Date(currentYear, month - 1, day)
      };

      // 渲染场景
      renderScene(res.length, res.angleDeg);
      
      // 更新散点图预览点
      updatePreviewPoint(currentData);

      // 激活记录按钮 (自动记录模式下，按钮仅作为状态提示)
      recordBtn.disabled = true;
      recordBtn.innerHTML = '&lt;span&gt;⚡&lt;/span&gt; 自动记录中...';
      recordBtn.classList.remove('bg-gray-300', 'cursor-not-allowed', 'bg-accent', 'hover:bg-red-700', 'shadow-lg');
      recordBtn.classList.add('bg-blue-500', 'text-white', 'cursor-default');
    }

    // 渲染场景核心逻辑
    function renderScene(length, angleDeg) {
      // 更新显示数值
      resultDisplay.innerText = `${length.toFixed(1)} cm`;

      // 动画更新
      // 1. 太阳位置
      const sunBottom = 20 + (angleDeg / 90) * 60;
      anime({
        targets: sunEl,
        bottom: `${sunBottom}%`,
        duration: 800,
        easing: 'easeOutQuad',
        update: function() {
           updateLightRay();
        }
      });

      // 2. 影子长度
      const maxLen = 350;
      const widthPercent = (length / maxLen) * 100;
      
      shadowEl.style.width = `${Math.min(widthPercent, 100)}%`;
      
      // 3. 标记点位置
      shadowTip.style.left = `calc(1.3rem + ${Math.min(widthPercent, 100)}%)`;
      shadowTip.style.opacity = 1;
      
      // 更新标记点数值
      shadowTipText.innerText = `${length.toFixed(1)} cm`;
      
      // 立即更新一次光线
      setTimeout(updateLightRay, 50);
    }

    // 回看历史记录
    window.restoreView = function(index) {
      const item = records[index];
      if (!item) return;
      
      viewingRecordIndex = index;
      
      // 切换到对应年份
      setYear(item.year);
      // 填入月份
      document.getElementById('monthInput').value = item.month;
      // 重新生成按钮
      handleMonthInput(item.month);
      
      // 模拟该日 (不自动记录)
      // simulateDay 会重置 viewingRecordIndex，所以要手动处理
      
      const res = calculateShadow(item.year, item.month, item.day);
      currentData = item;
      renderScene(item.length, res.angleDeg);
      updatePreviewPoint(item);
      
      // 更新按钮状态
      updateDateButtonsState();
      
      // 更新按钮状态：显示删除按钮
      const recordBtn = document.getElementById('recordBtn');
      const deleteBtn = document.getElementById('deleteBtn');
      
      recordBtn.classList.add('hidden');
      deleteBtn.classList.remove('hidden');
    };
    
    // 删除当前回看的记录
    window.deleteCurrentRecord = function() {
      if (viewingRecordIndex === -1) return;
      
      records.splice(viewingRecordIndex, 1);
      viewingRecordIndex = -1;
      
      // 恢复到自动记录状态
      document.getElementById('deleteBtn').classList.add('hidden');
      document.getElementById('recordBtn').classList.remove('hidden');
      
      // 更新图表和按钮状态
      updateCharts();
      updateDateButtonsState();
      
      // 提示
      resultDisplay.innerText = '-- cm';
      shadowEl.style.width = '0%';
      shadowTip.style.opacity = 0;
    };
    
    // 更新光线辅助线
    function updateLightRay() {
       const sunRect = sunEl.getBoundingClientRect();
       const tipRect = shadowTip.getBoundingClientRect();
       const containerRect = sunEl.parentElement.getBoundingClientRect();
       
       // 相对容器的坐标
       const x1 = sunRect.left + sunRect.width/2 - containerRect.left;
       const y1 = sunRect.top + sunRect.height/2 - containerRect.top;
       const x2 = tipRect.left + tipRect.width/2 - containerRect.left;
       const y2 = tipRect.top + tipRect.height - containerRect.top; // 指向箭头底部
       
       const length = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
       const angle = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
       
       lightRay.style.width = `${length}px`;
       lightRay.style.left = `${x1}px`;
       lightRay.style.top = `${y1}px`;
       lightRay.style.transform = `rotate(${angle}deg)`;
    }

    window.deleteRecord = function(index) {
      records.splice(index, 1);
      updateCharts();
    };

    // 注册插件
    Chart.register(ChartDataLabels);

    // --- 图表初始化 ---
    function createChartConfig(year, color) {
      return {
        type: 'line',
        data: {
          labels: Array.from({length: 31}, (_, i) =&gt; `${i + 1}日`),
          datasets: [
            {
              label: `${year}年记录`,
              data: [],
              backgroundColor: color,
              borderColor: color,
              pointRadius: 4,
              pointHoverRadius: 6,
              showLine: false,
              order: 2,
              datalabels: {
                display: true,
                align: 'top',
                anchor: 'end',
                offset: 4,
                color: color,
                font: { size: 10, weight: 'bold' },
                formatter: (value) =&gt; value.y.toFixed(1)
              }
            },
            {
              label: '当前预览',
              data: [],
              backgroundColor: '#F59E0B',
              borderColor: '#F59E0B',
              pointRadius: 6,
              pointHoverRadius: 8,
              pointStyle: 'rectRot',
              showLine: false,
              order: 1,
              datalabels: {
                display: true,
                align: 'bottom',
                anchor: 'start',
                offset: 4,
                color: '#F59E0B',
                font: { size: 11, weight: 'bold' },
                formatter: (value) =&gt; value.y.toFixed(1)
              }
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          onClick: (e, elements) =&gt; {
            if (elements.length &gt; 0) {
              const element = elements[0];
              const datasetIndex = element.datasetIndex;
              const index = element.index;
              // 只处理记录数据的点击
              if (datasetIndex === 0) {
                const chart = e.chart;
                const recordIndex = chart.data.datasets[0].data[index]._recordIndex;
                if (recordIndex !== undefined) {
                  restoreView(recordIndex);
                }
              }
            }
          },
          scales: {
            x: {
              type: 'category',
              title: { display: false }, // 节省空间
              grid: { drawOnChartArea: true },
              ticks: { font: { size: 10 } }
            },
            y: {
              beginAtZero: false,
              // 移除固定量程，改为自适应，使变化更清晰
              // min: 0,
              // max: 350,
              grace: '10%', // 上下留出 10% 的缓冲空间
              title: { display: true, text: '影长(cm)', font: { size: 10 } },
              grid: { color: '#f0f0f0' }
            }
          },
          plugins: {
            // 全局 datalabels 配置 (默认关闭，在 dataset 中单独开启)
            datalabels: {
               display: false
            },
            title: {
              display: true,
              text: `${year}年 观测数据`,
              font: { size: 14, weight: 'bold' },
              color: '#2D593E',
              padding: { top: 5, bottom: 5 }
            },
            legend: {
              display: true,
              labels: { boxWidth: 8, usePointStyle: true, font: { size: 10 } }
            },
            tooltip: {
              enabled: false // 关闭 tooltip，因为已经有 datalabels 了
            }
          }
        }
      };
    }

    // 初始化三个图表
    charts[2024] = new Chart(document.getElementById('chart2024').getContext('2d'), createChartConfig(2024, '#2563EB'));
    charts[2025] = new Chart(document.getElementById('chart2025').getContext('2d'), createChartConfig(2025, '#059669'));

    function updateCharts() {
      const currentMonth = parseInt(document.getElementById('monthInput').value);
      if (!currentMonth) return;
      
      const filteredRecords = records.filter(r =&gt; r.month === currentMonth);
      
      [2024, 2025].forEach(year =&gt; {
        const chart = charts[year];
        // 关键修复：对记录按日期排序，防止连线错乱
        const yearRecords = filteredRecords
          .filter(r =&gt; r.year === year)
          .sort((a, b) =&gt; a.day - b.day);
        
        // 更新记录点
        chart.data.datasets[0].data = yearRecords.map(r =&gt; ({
          x: r.day - 1,
          y: r.length,
          _recordIndex: records.indexOf(r)
        }));
        
        // 禁用动画以提高性能
        chart.update('none');
      });
    }
    
    function updatePreviewPoint(data) {
       const year = data.year;
       const chart = charts[year];
       
       // 清除所有图表的预览点
       Object.values(charts).forEach(c =&gt; {
         c.data.datasets[1].data = [];
         c.update();
       });
       
       // 只在当前年份图表显示预览点
       if (chart) {
         chart.data.datasets[1].data = [{
           x: data.day - 1,
           y: data.length
         }];
         chart.update();
       }
    }

    // 初始化
    // 默认选中2024年
    setYear(2024);
    // 默认显示3月份
    document.getElementById('monthInput').value = 3;
    handleMonthInput(3);
    // 默认模拟1日
    simulateDay(3, 1);

  &lt;/script&gt;

  <script>

    function getIsMobile() {
      const width = document.documentElement.clientWidth
      const isMobile = /Android|webOS|iPhone|iPod|BlackBerry|iPad|Windows Phone|Mobile/i.test(navigator.userAgent) || width <= 768
      return isMobile
    }


    // ==================== 埋点相关代码 ====================

    /**
     * 页面停留时长统计
     */
    (function () {
      let startTime = null
      let totalTime = 0
      let reportTimer = null // 防抖定时器

      // 开始计时
      function startTimer() {
        if (!startTime) {
          startTime = Date.now()
          console.log('[埋点] 开始计时')
        }
      }

      // 停止计时并累加时长
      function stopTimer() {
        if (startTime) {
          totalTime += Date.now() - startTime
          startTime = null
          console.log('[埋点] 停止计时，累计时长:', Math.floor(totalTime / 1000), '秒')
        }
      }

      // 检查页面是否真正可见
      function isPageVisible() {
        // 检查 document.hidden
        if (document.hidden) {
          return false
        }

        // 检查 document.visibilityState
        if (document.visibilityState && document.visibilityState !== 'visible') {
          return false
        }

        // 检查窗口是否有焦点
        if (!document.hasFocus()) {
          return false
        }

        return true
      }

      // 上报停留时长（带防抖）
      function reportStayTime(eventType, immediate = false) {
        stopTimer()

        // 清除之前的定时器
        if (reportTimer) {
          clearTimeout(reportTimer)
          reportTimer = null
        }

        // 如果是立即上报（如页面卸载），不使用防抖
        if (immediate) {
          doReport(eventType)
          return
        }

        // 使用防抖，避免短时间内多次上报
        // 100ms 内如果有多个事件触发，只上报最后一次
        reportTimer = setTimeout(function () {
          doReport(eventType)
          reportTimer = null
        }, 100)
      }

      // 实际执行上报
      function doReport(eventType) {
        if (window.frog && totalTime > 0) {
          const serverData = window.__SERVER_DATA__ || {}
          const chatId = serverData.watermarkChatId
          window.frog.add({
            url: '/time/HtmlPage/enter',
            eventId: 42818,
            customExtend: {
              chat_id: chatId,
              use_time: Math.floor(totalTime / 1000), // 转换为秒
            },
            duration: Math.floor(totalTime / 1000), // 转换为秒,
            currentPage: 'HtmlPage',
            eventAction: 'time',
            eventName: 'enter'
          })
          console.log(`[埋点] 页面停留时长上报 (${eventType}):`, Math.floor(totalTime / 1000), '秒')

          // 上报后重置累计时长，为下次统计做准备
          totalTime = 0
        }
      }

      // 清理函数：移除所有事件监听器
      function cleanup() {
        console.log('[埋点] 清理计时器资源')

        // 清除防抖定时器
        if (reportTimer) {
          clearTimeout(reportTimer)
          reportTimer = null
        }

        // 移除事件监听器
        document.removeEventListener('visibilitychange', handleVisibilityChange)
        window.removeEventListener('blur', handleBlur)
        window.removeEventListener('focus', handleFocus)
        window.removeEventListener('beforeunload', handleBeforeUnload)
        window.removeEventListener('pagehide', handlePageHide)

        // 重置变量
        startTime = null
        totalTime = 0
      }

      // 事件处理函数（需要命名以便移除）
      function handleVisibilityChange() {
        if (document.hidden) {
          // 页面不可见，停止计时并上报
          console.log('[埋点] visibilitychange - 页面隐藏')
          reportStayTime('visibilitychange')
        } else {
          // 页面可见，开始新的计时
          console.log('[埋点] visibilitychange - 页面显示，开始新的计时')
          startTimer()
        }
      }

      function handleBlur() {
        // 窗口失去焦点，停止计时并上报
        console.log('[埋点] blur - 窗口失去焦点')
        reportStayTime('blur')
      }

      function handleFocus() {
        // 窗口获得焦点，开始新的计时
        console.log('[埋点] focus - 窗口获得焦点，开始新的计时')
        startTimer()
      }

      function handleBeforeUnload() {
        // 页面卸载前立即上报（不使用防抖）
        console.log('[埋点] beforeunload - 页面即将卸载')
        reportStayTime('beforeunload', true)
        cleanup()
      }

      function handlePageHide() {
        // 页面隐藏时立即上报（iOS Safari 更可靠，不使用防抖）
        console.log('[埋点] pagehide - 页面隐藏')
        reportStayTime('pagehide', true)
      }

      function handleDOMContentLoaded() {
        if (isPageVisible()) {
          startTimer()
        }
      }

      // 监听页面可见性变化
      document.addEventListener('visibilitychange', handleVisibilityChange)

      // 监听窗口失去/获得焦点
      window.addEventListener('blur', handleBlur)
      window.addEventListener('focus', handleFocus)

      // 页面加载完成后开始计时
      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', handleDOMContentLoaded)
      } else {
        if (isPageVisible()) {
          startTimer()
        }
      }

      // 页面卸载时上报
      window.addEventListener('beforeunload', handleBeforeUnload)

      // 兼容性：监听 pagehide 事件（iOS Safari 更可靠）
      window.addEventListener('pagehide', handlePageHide)
    })()

    function adjustRem() {
      const pcBaseWidth = 375 // 设计稿
      const width = document.documentElement.clientWidth
      document.documentElement.style.fontSize = `${(width / pcBaseWidth * 100).toFixed(2)}px`
    }


    // 移动端检测和按钮隐藏逻辑
    function checkAndHideButtonOnMobile() {
      const isMobile = getIsMobile()
      if (isMobile) {
        adjustRem()
      }
      const iframeContainer = document.querySelector('.iframe-container');

      // 移动端时给iframe-container添加类名，否则移除类名
      if (iframeContainer) {
        if (isMobile) {
          iframeContainer.classList.add('mobile');
        } else {
          iframeContainer.classList.remove('mobile');
        }
      }
    }


    function handleResize() {
      // 响应式处理：重新检测移动端并处理按钮显示/隐藏
      checkAndHideButtonOnMobile();

      // 在窗口大小变化时，重新应用移动端相关的逻辑
      const isMobile = getIsMobile()
      const iframeContainer = document.querySelector('.iframe-container');

      // 确保在resize时也能正确添加或移除mobile类
      if (iframeContainer) {
        if (isMobile) {
          iframeContainer.classList.add('mobile');
        } else {
          iframeContainer.classList.remove('mobile');
        }
      }
    }

    // 防止iframe内容溢出
    window.addEventListener('resize', handleResize);

    // 页面加载完成后执行移动端检测
    document.addEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);

    // 清理所有事件绑定的函数
    function clearAllEvents() {
      // 清除 resize 事件监听器
      window.removeEventListener('resize', handleResize);

      // 清除 DOMContentLoaded 事件监听器
      document.removeEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);
    }

    // 页面卸载时自动清理事件（可选）
    window.addEventListener('beforeunload', clearAllEvents);

  </script>
