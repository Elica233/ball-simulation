    &lt;script type=&quot;module&quot;&gt;
        // --- 1. Three.js 场景初始化 ---
        const container = document.getElementById('canvas-container');

        scene.background = new THREE.Color(0xe0f2fe); // 天空蓝
        scene.fog = new THREE.Fog(0xe0f2fe, 20, 100);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 6, 10); // 稍微拉远一点，保证视野
        camera.lookAt(0, 2.5, 0); // 看向竿子上方，使竿子在屏幕中下移（靠近表格）

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 2.5, 0); // 设置旋转中心也为竿子上方
        controls.maxPolarAngle = Math.PI / 2 - 0.1; // 防止相机钻入地下
        controls.minDistance = 5;
        controls.maxDistance = 50;

        // --- 2. 场景物体 ---
        
        // 地面 (极简风格)
        const planeGeometry = new THREE.PlaneGeometry(100, 100);
        const planeMaterial = new THREE.MeshBasicMaterial({ 
            color: 0xf8fafc, // 极淡的灰白色，减少干扰
        });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;
        scene.add(plane);

        // 竿子 (高度2米)
        const POLE_HEIGHT = 2;
        const poleGeometry = new THREE.CylinderGeometry(0.05, 0.05, POLE_HEIGHT, 32);
        const poleMaterial = new THREE.MeshStandardMaterial({ color: 0x475569 });
        const pole = new THREE.Mesh(poleGeometry, poleMaterial);
        pole.position.y = POLE_HEIGHT / 2;
        pole.castShadow = true;
        pole.receiveShadow = true;
        scene.add(pole);

        // 太阳 (光源 + 可视化球体)
        const sunGroup = new THREE.Group();
        scene.add(sunGroup);

        // 平行光模拟太阳光 (仅用于产生阴影，不影响整体亮度)
        const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 100;
        sunLight.shadow.camera.left = -50;
        sunLight.shadow.camera.right = 50;
        sunLight.shadow.camera.top = 50;
        sunLight.shadow.camera.bottom = -50;
        sunGroup.add(sunLight);

        // 太阳可视化球体
        const sunMesh = new THREE.Mesh(
            new THREE.SphereGeometry(0.5, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xf59e0b })
        );
        sunGroup.add(sunMesh);

        // 环境光 (增强亮度，消除明暗变化)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        // --- 3. 天文计算逻辑 ---
        
        // 纬度 (北纬 30度)
        const LATITUDE = 30; 
        const LAT_RAD = LATITUDE * Math.PI / 180;

        // 计算一年中的第几天
        function getDayOfYear(date) {
            const start = new Date(date.getFullYear(), 0, 0);
            const diff = date - start;
            const oneDay = 1000 * 60 * 60 * 24;
            return Math.floor(diff / oneDay);
        }

        // 计算太阳赤纬角 delta (单位: 弧度)
        function getDeclination(date) {
            const n = getDayOfYear(date);
            const angle = 2 * Math.PI * (n + 284) / 365;
            const deltaDeg = 23.45 * Math.sin(angle);
            return deltaDeg * Math.PI / 180;
        }

        // 计算太阳位置
        function calculateSunPosition(date, hour) {
            const delta = getDeclination(date);
            const omegaDeg = (hour - 12) * 15;
            const omega = omegaDeg * Math.PI / 180;

            const sinAlpha = Math.sin(LAT_RAD) * Math.sin(delta) + 
                             Math.cos(LAT_RAD) * Math.cos(delta) * Math.cos(omega);
            const alpha = Math.asin(sinAlpha);

            let cosA = (Math.sin(alpha) * Math.sin(LAT_RAD) - Math.sin(delta)) / 
                       (Math.cos(alpha) * Math.cos(LAT_RAD));
            
            if (cosA &gt; 1) cosA = 1;
            if (cosA &lt; -1) cosA = -1;
            
            let A = Math.acos(cosA);
            if (hour &lt; 12) A = -A;

            const DISTANCE = 20;
            const y = DISTANCE * Math.sin(alpha);
            const r = DISTANCE * Math.cos(alpha);
            const x = -r * Math.sin(A);
            const z = r * Math.cos(A);

            let shadowLen = 0;
            if (alpha &gt; 0) {
                shadowLen = POLE_HEIGHT / Math.tan(alpha);
            } else {
                shadowLen = 0;
            }

            return { x, y, z, shadowLen, alphaDeg: alpha * 180 / Math.PI };
        }

        // --- 4. 交互逻辑 ---
        
        const yearInput = document.getElementById('year-input');
        const monthInput = document.getElementById('month-input');
        const dayInput = document.getElementById('day-input');
        const calcBtn = document.getElementById('calc-btn');
        const animateBtn = document.getElementById('animate-btn');
        const showAllBtn = document.getElementById('show-all-btn');
        const recordBtn = document.getElementById('record-btn');
        const timeIndicator = document.getElementById('time-indicator');
        const shadowLabel = document.getElementById('shadow-label');
        
        let currentData = null;
        let currentShadowTipPos = null;
        const addedHours = new Set();
        
        const staticShadowGroup = new THREE.Group();
        scene.add(staticShadowGroup);

        const dynShadowGeo = new THREE.PlaneGeometry(0.1, 1);
        dynShadowGeo.translate(0, 0.5, 0);
        dynShadowGeo.rotateX(Math.PI / 2);
        const dynShadowMat = new THREE.MeshBasicMaterial({ 
            color: 0x000000, 
            transparent: true, 
            opacity: 0.5,
            side: THREE.DoubleSide
        });
        const dynamicShadow = new THREE.Mesh(dynShadowGeo, dynShadowMat);
        dynamicShadow.position.y = 0.02;
        dynamicShadow.visible = false;
        scene.add(dynamicShadow);

        function updateSun(date, hour, showLabel = true) {
            const pos = calculateSunPosition(date, hour);
            
            if (pos.y &lt; 0) pos.y = 0;

            sunGroup.position.set(pos.x, pos.y, pos.z);
            sunLight.position.set(0, 0, 0);
            sunLight.target.position.set(-pos.x, -pos.y, -pos.z);
            sunLight.target.updateMatrixWorld();
            
            sunLight.intensity = 0.8;
            ambientLight.intensity = 0.6;
            
            if (pos.y &gt; 0.01) {
                const ratio = POLE_HEIGHT / pos.y;
                const tipX = -pos.x * ratio;
                const tipZ = -pos.z * ratio;
                const len = Math.sqrt(tipX*tipX + tipZ*tipZ);
                
                dynamicShadow.visible = true;
                dynamicShadow.scale.set(1, 1, len);
                dynamicShadow.lookAt(tipX, 0.02, tipZ);
                
                let opacity = 0.5;
                if (len &gt; 10) {
                    opacity = Math.max(0, 0.5 * (1 - (len - 10) / 10));
                }
                dynamicShadow.material.opacity = opacity;
                dynamicShadow.visible = opacity &gt; 0.01;
                
            } else {
                dynamicShadow.visible = false;
            }
            
            if (showLabel &amp;&amp; pos.y &gt; 0.1) {
                const ratio = POLE_HEIGHT / pos.y;
                const shadowTipX = -pos.x * ratio;
                const shadowTipZ = -pos.z * ratio;
                currentShadowTipPos = new THREE.Vector3(shadowTipX, 0, shadowTipZ);
                
                const lenCm = (pos.shadowLen * 100).toFixed(1);
                const h = Math.floor(hour);
                const m = Math.floor((hour - h) * 60);
                const timeStr = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
                
                shadowLabel.innerHTML = `&lt;b&gt;${timeStr}&lt;/b&gt;&lt;br&gt;影长: ${lenCm} cm`;
                shadowLabel.classList.remove('hidden');
                timeIndicator.textContent = timeStr;
                timeIndicator.classList.remove('hidden');
            } else {
                shadowLabel.classList.add('hidden');
                currentShadowTipPos = null;
            }

            return pos.shadowLen;
        }

        updateSun(new Date(), 12, false);

        function drawStaticShadow(date, hour) {
            const pos = calculateSunPosition(date, hour);
            if (pos.y &lt;= 0) return;
            
            const ratio = POLE_HEIGHT / pos.y;
            const tipX = -pos.x * ratio;
            const tipZ = -pos.z * ratio;
            const len = Math.sqrt(tipX*tipX + tipZ*tipZ);
            
            const geometry = new THREE.PlaneGeometry(0.1, 1);
            geometry.translate(0, 0.5, 0);
            geometry.rotateX(Math.PI/2);
            geometry.scale(1, 1, len);
            
            const material = new THREE.MeshBasicMaterial({ 
                color: 0x000000, 
                transparent: true, 
                opacity: 0.3,
                side: THREE.DoubleSide
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.y = 0.01;
            
            mesh.lookAt(tipX, 0.01, tipZ);
            
            staticShadowGroup.add(mesh);
            
            const lenCm = (pos.shadowLen * 100).toFixed(1);
            const h = Math.floor(hour);
            const m = Math.floor((hour - h) * 60);
            const timeStr = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
            
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 512;
            canvas.height = 256;
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.roundRect(0, 0, 512, 256, 40);
            ctx.fill();
            
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 96px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(timeStr, 256, 80);
            
            ctx.font = '72px Arial';
            ctx.fillStyle = '#fbbf24';
            ctx.fillText(`${lenCm} cm`, 256, 180);
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
            
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture, depthTest: false });
            const sprite = new THREE.Sprite(spriteMaterial);
            
            let labelHeight = 1.5;
            if (hour === 12) labelHeight = 4.5;
            else if (hour === 10 || hour === 14) labelHeight = 3.0;
            else labelHeight = 1.5;

            sprite.position.set(tipX, labelHeight, tipZ);
            sprite.scale.set(3, 1.5, 1);
            sprite.renderOrder = 999;
            
            staticShadowGroup.add(sprite);
            
            const lineGeo = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(tipX, 0, tipZ),
                new THREE.Vector3(tipX, labelHeight, tipZ)
            ]);
            const lineMat = new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.3 });
            const line = new THREE.Line(lineGeo, lineMat);
            staticShadowGroup.add(line);
        }

        window.selectTime = (hour) =&gt; {
            if (!currentData) {
                calcBtn.click();
                if (!currentData) return;
            }
            
            const y = parseInt(yearInput.value);
            const m = parseInt(monthInput.value);
            const d = parseInt(dayInput.value);
            const date = new Date(y, m - 1, d);
            
            if (!addedHours.has(hour)) {
                drawStaticShadow(date, hour);
                addedHours.add(hour);
            }
            
            updateSun(date, hour, false);
        };

        animateBtn.addEventListener('click', () =&gt; {
            const y = parseInt(yearInput.value);
            const m = parseInt(monthInput.value);
            const d = parseInt(dayInput.value);
            const date = new Date(y, m - 1, d);
            
            staticShadowGroup.clear();
            addedHours.clear();
            shadowLabel.classList.add('hidden');
            currentShadowTipPos = null;
            
            animateBtn.disabled = true;
            calcBtn.disabled = true;
            showAllBtn.disabled = true;
            recordBtn.disabled = true;
            
            const startHour = 7.5;
            const endHour = 16.5;
            const duration = 3000;
            let startTime = null;
            
            function loop(timestamp) {
                if (!startTime) startTime = timestamp;
                const progress = (timestamp - startTime) / duration;
                
                if (progress &lt; 1) {
                    const currentHour = startHour + (endHour - startHour) * progress;
                    updateSun(date, currentHour, false);
                    
                    const h = Math.floor(currentHour);
                    const min = Math.floor((currentHour - h) * 60);
                    timeIndicator.textContent = `${h.toString().padStart(2, '0')}:${min.toString().padStart(2, '0')}`;
                    timeIndicator.classList.remove('hidden');
                    
                    requestAnimationFrame(loop);
                } else {
                    updateSun(date, 12, false);
                    timeIndicator.classList.add('hidden');
                    
                    animateBtn.disabled = false;
                    calcBtn.disabled = false;
                    if (currentData) {
                        showAllBtn.disabled = false;
                        recordBtn.disabled = false;
                    }
                }
            }
            
            requestAnimationFrame(loop);
        });

        calcBtn.addEventListener('click', () =&gt; {
            const y = parseInt(yearInput.value);
            const m = parseInt(monthInput.value);
            const d = parseInt(dayInput.value);
            
            if (!y || !m || !d) return;
            
            staticShadowGroup.clear();
            addedHours.clear();
            
            const date = new Date(y, m - 1, d);
            const dateStr = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const times = [8, 10, 12, 14, 16];
            const results = {};

            times.forEach(t =&gt; {
                const res = calculateSunPosition(date, t);
                results[t] = (res.alphaDeg &gt; 0) ? (res.shadowLen * 100).toFixed(1) : &quot;无&quot;;
            });

            document.getElementById('current-date-display').textContent = dateStr;

            currentData = { date: dateStr, ...results };
            recordBtn.disabled = false;
            showAllBtn.disabled = false;
        });
        
        showAllBtn.addEventListener('click', () =&gt; {
            if (!currentData) return;
            const y = parseInt(yearInput.value);
            const m = parseInt(monthInput.value);
            const d = parseInt(dayInput.value);
            const date = new Date(y, m - 1, d);
            
            staticShadowGroup.clear();
            addedHours.clear();
            
            [8, 10, 12, 14, 16].forEach(h =&gt; {
                drawStaticShadow(date, h);
                addedHours.add(h);
            });
            
            shadowLabel.classList.add('hidden');
            currentShadowTipPos = null;
            
            dynamicShadow.visible = false;
            
            updateSun(date, 12, false);
        });

        recordBtn.addEventListener('click', () =&gt; {
            if (!currentData) return;

            const tbody = document.getElementById('record-table-body');
            const emptyTip = document.getElementById('empty-tip');
            if (emptyTip) emptyTip.remove();

            const tr = document.createElement('tr');
            tr.className = &quot;hover:bg-blue-50/50 transition-colors group&quot;;
            tr.innerHTML = `
                &lt;td class=&quot;px-6 py-4 border-b border-gray-50 font-mono text-gray-600 font-medium group-hover:text-primary transition-colors&quot;&gt;${currentData.date}&lt;/td&gt;
                &lt;td class=&quot;px-2 py-4 border-b border-gray-50 font-bold text-gray-800 text-center&quot;&gt;${currentData[8]}&lt;/td&gt;
                &lt;td class=&quot;px-2 py-4 border-b border-gray-50 font-bold text-gray-800 text-center&quot;&gt;${currentData[10]}&lt;/td&gt;
                &lt;td class=&quot;px-2 py-4 border-b border-gray-50 font-bold text-amber-600 text-lg text-center bg-amber-50/30&quot;&gt;${currentData[12]}&lt;/td&gt;
                &lt;td class=&quot;px-2 py-4 border-b border-gray-50 font-bold text-gray-800 text-center&quot;&gt;${currentData[14]}&lt;/td&gt;
                &lt;td class=&quot;px-2 py-4 border-b border-gray-50 font-bold text-gray-800 text-center&quot;&gt;${currentData[16]}&lt;/td&gt;
            `;
            
            tbody.appendChild(tr);
            
            tr.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            
            anime({
                targets: tr,
                opacity: [0, 1],
                translateX: [-20, 0],
                duration: 500,
                easing: 'easeOutExpo'
            });
        });

        window.addEventListener('resize', () =&gt; {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        function animateLoop() {
            requestAnimationFrame(animateLoop);
            controls.update();
            renderer.render(scene, camera);
            
            if (currentShadowTipPos) {
                const vector = currentShadowTipPos.clone();
                vector.project(camera);
                
                const x = (vector.x * .5 + .5) * container.clientWidth;
                const y = (-(vector.y * .5) + .5) * container.clientHeight;
                
                shadowLabel.style.left = `${x}px`;
                shadowLabel.style.top = `${y}px`;
            }
        }
        animateLoop();

    &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;" frameborder="0">
    </iframe>
  </div>

  <script>
    function getIsMobile() {
      const width = document.documentElement.clientWidth
      const isMobile = /Android|webOS|iPhone|iPod|BlackBerry|iPad|Windows Phone|Mobile/i.test(navigator.userAgent) || width <= 768
      return isMobile
    }

    function adjustRem() {
      const pcBaseWidth = 375
      const width = document.documentElement.clientWidth
      document.documentElement.style.fontSize = `${(width / pcBaseWidth * 100).toFixed(2)}px`
    }

    function checkAndHideButtonOnMobile() {
      const isMobile = getIsMobile()
      if (isMobile) {
        adjustRem()
      }
      const iframeContainer = document.querySelector('.iframe-container');
      if (iframeContainer) {
        if (isMobile) {
          iframeContainer.classList.add('mobile');
        } else {
          iframeContainer.classList.remove('mobile');
        }
      }
    }

    function handleResize() {
      checkAndHideButtonOnMobile();
      const isMobile = getIsMobile()
      const iframeContainer = document.querySelector('.iframe-container');
      if (iframeContainer) {
        if (isMobile) {
          iframeContainer.classList.add('mobile');
        } else {
          iframeContainer.classList.remove('mobile');
        }
      }
    }

    window.addEventListener('resize', handleResize);
    document.addEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);

    function clearAllEvents() {
      window.removeEventListener('resize', handleResize);
      document.removeEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);
    }
    window.addEventListener('beforeunload', clearAllEvents);
  </script>
