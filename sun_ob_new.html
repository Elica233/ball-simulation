    &lt;script type=&quot;module&quot;&gt;
        // --- 1. Three.js 场景初始化 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe0f2fe); // 天空蓝
        scene.fog = new THREE.Fog(0xe0f2fe, 20, 100);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 15, 15); // 俯视角度
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.1; // 防止相机钻入地下
        controls.minDistance = 5;
        controls.maxDistance = 50;

        // --- 2. 场景物体 ---
        
        // 地面
        const planeGeometry = new THREE.PlaneGeometry(100, 100);
        const planeMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xecfccb, // 浅草绿
            roughness: 0.8 
        });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;
        scene.add(plane);

        // 网格辅助 (更科学的感觉)
        const gridHelper = new THREE.GridHelper(20, 20, 0x94a3b8, 0xcbd5e1);
        scene.add(gridHelper);

        // 指南针/方位指示
        const createCompass = () =&gt; {
            const group = new THREE.Group();
            const loader = new THREE.FontLoader();
            // 简单用几何体代替文字指示方向
            const nMat = new THREE.MeshBasicMaterial({color: 0xef4444});
            const sMat = new THREE.MeshBasicMaterial({color: 0x3b82f6});
            
            // 北标记 (红色锥体)
            const nCone = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.8, 4), nMat);
            nCone.position.set(0, 0.05, -11);
            nCone.rotation.x = Math.PI / 2;
            group.add(nCone);
            
            // 南标记 (蓝色锥体)
            const sCone = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.8, 4), sMat);
            sCone.position.set(0, 0.05, 11);
            sCone.rotation.x = -Math.PI / 2;
            group.add(sCone);
            
            return group;
        };
        scene.add(createCompass());

        // 竿子 (高度2米)
        const POLE_HEIGHT = 2;
        const poleGeometry = new THREE.CylinderGeometry(0.05, 0.05, POLE_HEIGHT, 32);
        const poleMaterial = new THREE.MeshStandardMaterial({ color: 0x475569 });
        const pole = new THREE.Mesh(poleGeometry, poleMaterial);
        pole.position.y = POLE_HEIGHT / 2;
        pole.castShadow = true;
        pole.receiveShadow = true;
        scene.add(pole);

        // 太阳 (光源 + 可视化球体)
        const sunGroup = new THREE.Group();
        scene.add(sunGroup);

        // 平行光模拟太阳光
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 100;
        sunLight.shadow.camera.left = -10;
        sunLight.shadow.camera.right = 10;
        sunLight.shadow.camera.top = 10;
        sunLight.shadow.camera.bottom = -10;
        sunGroup.add(sunLight);

        // 太阳可视化球体
        const sunMesh = new THREE.Mesh(
            new THREE.SphereGeometry(0.5, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xf59e0b })
        );
        sunGroup.add(sunMesh);

        // 环境光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        // --- 3. 天文计算逻辑 ---
        
        // 纬度 (北纬 30度)
        const LATITUDE = 30; 
        const LAT_RAD = LATITUDE * Math.PI / 180;

        // 计算一年中的第几天
        function getDayOfYear(date) {
            const start = new Date(date.getFullYear(), 0, 0);
            const diff = date - start;
            const oneDay = 1000 * 60 * 60 * 24;
            return Math.floor(diff / oneDay);
        }

        // 计算太阳赤纬角 delta (单位: 弧度)
        // 简化的 Cooper 方程: delta = 23.45 * sin(360/365 * (284 + n))
        function getDeclination(date) {
            const n = getDayOfYear(date);
            const angle = 2 * Math.PI * (n + 284) / 365;
            const deltaDeg = 23.45 * Math.sin(angle);
            return deltaDeg * Math.PI / 180;
        }

        // 计算太阳位置
        // hour: 24小时制的小数 (例如 14.5 表示 14:30)
        function calculateSunPosition(date, hour) {
            const delta = getDeclination(date);
            
            // 时角 omega (正午为0，上午为负，下午为正，每小时15度)
            // 12:00 -&gt; 0, 13:00 -&gt; 15度
            const omegaDeg = (hour - 12) * 15;
            const omega = omegaDeg * Math.PI / 180;

            // 太阳高度角 alpha
            // sin(alpha) = sin(phi)sin(delta) + cos(phi)cos(delta)cos(omega)
            const sinAlpha = Math.sin(LAT_RAD) * Math.sin(delta) + 
                             Math.cos(LAT_RAD) * Math.cos(delta) * Math.cos(omega);
            const alpha = Math.asin(sinAlpha);

            // 太阳方位角 A (从正南算起，向西为正)
            // cos(A) = (sin(alpha)sin(phi) - sin(delta)) / (cos(alpha)cos(phi))
            // 注意：Three.js 坐标系中，通常 Z轴正向为南(或北，取决于设定)。
            // 这里我们设定：Z轴正向为南，X轴正向为东。
            // 实际上 Three.js 默认 Y向上。
            // 我们需要将天文学坐标转换为 Three.js 坐标 (x, y, z)
            
            // 简化计算直角坐标：
            // y = sin(alpha)
            // 水平投影半径 r = cos(alpha)
            // x = r * sin(A_azimuth)  (东)
            // z = r * cos(A_azimuth)  (南)
            
            // 计算方位角 (以正南为0，顺时针为正，即向西为正)
            let cosA = (Math.sin(alpha) * Math.sin(LAT_RAD) - Math.sin(delta)) / 
                       (Math.cos(alpha) * Math.cos(LAT_RAD));
            
            // 限制范围防止数值误差
            if (cosA &gt; 1) cosA = 1;
            if (cosA &lt; -1) cosA = -1;
            
            let A = Math.acos(cosA);
            if (hour &lt; 12) A = -A; // 上午在东侧

            // 转换为 Three.js 坐标 (假设距离为 20)
            const DISTANCE = 20;
            const y = DISTANCE * Math.sin(alpha);
            const r = DISTANCE * Math.cos(alpha);
            // 注意：方位角 A 是相对于正南的。
            // 在我们的场景中，Z轴正向设为南。
            // 上午(东) -&gt; x 正 ? 
            // 让我们校准一下：
            // 12点时，A=0，在正南(Z+)。
            // 8点时，A&lt;0 (东)，应该在 X- ?
            // 按照通常地图：上北下南左西右东。
            // Three.js: Z+ 屏幕外(南), Z- 屏幕内(北), X+ 右(东), X- 左(西)
            // 修正：
            // 12点(正南): x=0, z=r
            // 18点(正西): x=-r, z=0
            // 06点(正东): x=r, z=0
            // 所以 x = -r * sin(A)
            // z = r * cos(A)
            
            const x = -r * Math.sin(A);
            const z = r * Math.cos(A);

            // 计算影长
            // L = H / tan(alpha)
            let shadowLen = 0;
            if (alpha &gt; 0) {
                shadowLen = POLE_HEIGHT / Math.tan(alpha);
            } else {
                shadowLen = 0; // 太阳在地平线以下
            }

            return { x, y, z, shadowLen, alphaDeg: alpha * 180 / Math.PI };
        }

        // --- 4. 交互逻辑 ---
        
        const yearInput = document.getElementById('year-input');
        const monthInput = document.getElementById('month-input');
        const dayInput = document.getElementById('day-input');
        const calcBtn = document.getElementById('calc-btn');
        const recordBtn = document.getElementById('record-btn');
        const timeIndicator = document.getElementById('time-indicator');
        
        // 默认值已在HTML中设置 (2025-01-01)

        let currentData = null;
        let isAnimating = false;

        // 更新太阳位置
        function updateSun(date, hour) {
            const pos = calculateSunPosition(date, hour);
            
            // 如果太阳在地平线以下，稍微处理一下避免阴影错误
            if (pos.y &lt; 0) pos.y = 0;

            sunGroup.position.set(pos.x, pos.y, pos.z);
            sunLight.position.set(0, 0, 0); // 光源相对 Group 的位置
            sunLight.target.position.set(-pos.x, -pos.y, -pos.z); // 指向原点
            sunLight.target.updateMatrixWorld();
            
            // 调整光强，晚上变暗
            sunLight.intensity = pos.y &gt; 0 ? 1.2 : 0;
            ambientLight.intensity = pos.y &gt; 0 ? 0.4 : 0.1;

            return pos.shadowLen;
        }

        // 初始化位置 (12:00)
        updateSun(new Date(), 12);

        // 动画对象
        const animObj = { hour: 8 };

        calcBtn.addEventListener('click', () =&gt; {
            if (isAnimating) return;
            
            const y = parseInt(yearInput.value);
            const m = parseInt(monthInput.value);
            const d = parseInt(dayInput.value);
            
            if (!y || !m || !d) return;
            
            const date = new Date(y, m - 1, d);
            const dateStr = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const times = [8, 10, 12, 14, 16];
            const results = {};

            // 计算数据
            times.forEach(t =&gt; {
                const res = calculateSunPosition(date, t);
                // 保留1位小数，单位转换为厘米
                results[t] = (res.alphaDeg &gt; 0) ? (res.shadowLen * 100).toFixed(1) : &quot;无&quot;;
            });

            // 更新显示
            document.getElementById('current-date-display').textContent = dateStr;
            times.forEach(t =&gt; {
                document.getElementById(`val-${t}`).textContent = results[t];
            });

            currentData = { date: dateStr, ...results };
            recordBtn.disabled = false;

            // 播放动画：从 6:00 到 18:00 扫一遍，最后停在 12:00
            isAnimating = true;
            timeIndicator.classList.remove('hidden');
            animObj.hour = 6;
            
            anime({
                targets: animObj,
                hour: 18,
                duration: 3000,
                easing: 'linear',
                update: () =&gt; {
                    updateSun(date, animObj.hour);
                    // 格式化时间显示
                    const h = Math.floor(animObj.hour);
                    const m = Math.floor((animObj.hour - h) * 60);
                    timeIndicator.textContent = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
                },
                complete: () =&gt; {
                    // 动画结束后回到 12:00
                    anime({
                        targets: animObj,
                        hour: 12,
                        duration: 800,
                        easing: 'easeOutExpo',
                        update: () =&gt; {
                            updateSun(date, animObj.hour);
                            timeIndicator.textContent = &quot;12:00&quot;;
                        },
                        complete: () =&gt; {
                            isAnimating = false;
                        }
                    });
                }
            });
        });

        recordBtn.addEventListener('click', () =&gt; {
            if (!currentData) return;

            const tbody = document.getElementById('record-table-body');
            const emptyTip = document.getElementById('empty-tip');
            if (emptyTip) emptyTip.remove();

            const tr = document.createElement('tr');
            tr.className = &quot;hover:bg-blue-50/50 transition-colors group&quot;;
            tr.innerHTML = `
                &lt;td class=&quot;px-6 py-4 border-b border-gray-50 font-mono text-gray-600 font-medium group-hover:text-primary transition-colors&quot;&gt;${currentData.date}&lt;/td&gt;
                &lt;td class=&quot;px-2 py-4 border-b border-gray-50 font-bold text-gray-800 text-center&quot;&gt;${currentData[8]}&lt;/td&gt;
                &lt;td class=&quot;px-2 py-4 border-b border-gray-50 font-bold text-gray-800 text-center&quot;&gt;${currentData[10]}&lt;/td&gt;
                &lt;td class=&quot;px-2 py-4 border-b border-gray-50 font-bold text-amber-600 text-lg text-center bg-amber-50/30&quot;&gt;${currentData[12]}&lt;/td&gt;
                &lt;td class=&quot;px-2 py-4 border-b border-gray-50 font-bold text-gray-800 text-center&quot;&gt;${currentData[14]}&lt;/td&gt;
                &lt;td class=&quot;px-2 py-4 border-b border-gray-50 font-bold text-gray-800 text-center&quot;&gt;${currentData[16]}&lt;/td&gt;
            `;
            
            // 插入到最后一行 (正序排列)
            tbody.appendChild(tr);
            
            // 自动滚动到底部
            tr.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            
            // 简单的入场动画
            anime({
                targets: tr,
                opacity: [0, 1],
                translateX: [-20, 0],
                duration: 500,
                easing: 'easeOutExpo'
            });
        });

        // 窗口大小调整
        window.addEventListener('resize', () =&gt; {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // 渲染循环
        function animateLoop() {
            requestAnimationFrame(animateLoop);
            controls.update();
            renderer.render(scene, camera);
        }
        animateLoop();

    &lt;/script&gt;

    </iframe>

  </div>


  <script>

    function getIsMobile() {
      const width = document.documentElement.clientWidth
      const isMobile = /Android|webOS|iPhone|iPod|BlackBerry|iPad|Windows Phone|Mobile/i.test(navigator.userAgent) || width <= 768
      return isMobile
    }

    // ==================== 埋点相关代码 ====================

    /**
     * 页面停留时长统计
     */
    (function () {
      let startTime = null
      let totalTime = 0
      let reportTimer = null // 防抖定时器

      // 开始计时
      function startTimer() {
        if (!startTime) {
          startTime = Date.now()
          console.log('[埋点] 开始计时')
        }
      }

      // 停止计时并累加时长
      function stopTimer() {
        if (startTime) {
          totalTime += Date.now() - startTime
          startTime = null
          console.log('[埋点] 停止计时，累计时长:', Math.floor(totalTime / 1000), '秒')
        }
      }

      // 检查页面是否真正可见
      function isPageVisible() {
        // 检查 document.hidden
        if (document.hidden) {
          return false
        }

        // 检查 document.visibilityState
        if (document.visibilityState && document.visibilityState !== 'visible') {
          return false
        }

        // 检查窗口是否有焦点
        if (!document.hasFocus()) {
          return false
        }

        return true
      }

      // 上报停留时长（带防抖）
      function reportStayTime(eventType, immediate = false) {
        stopTimer()

        // 清除之前的定时器
        if (reportTimer) {
          clearTimeout(reportTimer)
          reportTimer = null
        }

        // 如果是立即上报（如页面卸载），不使用防抖
        if (immediate) {
          doReport(eventType)
          return
        }

        // 使用防抖，避免短时间内多次上报
        // 100ms 内如果有多个事件触发，只上报最后一次
        reportTimer = setTimeout(function () {
          doReport(eventType)
          reportTimer = null
        }, 100)
      }

      // 实际执行上报
      function doReport(eventType) {
        if (window.frog && totalTime > 0) {
          const serverData = window.__SERVER_DATA__ || {}
          const chatId = serverData.watermarkChatId
          window.frog.add({
            url: '/time/HtmlPage/enter',
            eventId: 42818,
            customExtend: {
              chat_id: chatId,
              use_time: Math.floor(totalTime / 1000), // 转换为秒
            },
            duration: Math.floor(totalTime / 1000), // 转换为秒,
            currentPage: 'HtmlPage',
            eventAction: 'time',
            eventName: 'enter'
          })
          console.log(`[埋点] 页面停留时长上报 (${eventType}):`, Math.floor(totalTime / 1000), '秒')

          // 上报后重置累计时长，为下次统计做准备
          totalTime = 0
        }
      }

      // 清理函数：移除所有事件监听器
      function cleanup() {
        console.log('[埋点] 清理计时器资源')

        // 清除防抖定时器
        if (reportTimer) {
          clearTimeout(reportTimer)
          reportTimer = null
        }

        // 移除事件监听器
        document.removeEventListener('visibilitychange', handleVisibilityChange)
        window.removeEventListener('blur', handleBlur)
        window.removeEventListener('focus', handleFocus)
        window.removeEventListener('beforeunload', handleBeforeUnload)
        window.removeEventListener('pagehide', handlePageHide)

        // 重置变量
        startTime = null
        totalTime = 0
      }

      // 事件处理函数（需要命名以便移除）
      function handleVisibilityChange() {
        if (document.hidden) {
          // 页面不可见，停止计时并上报
          console.log('[埋点] visibilitychange - 页面隐藏')
          reportStayTime('visibilitychange')
        } else {
          // 页面可见，开始新的计时
          console.log('[埋点] visibilitychange - 页面显示，开始新的计时')
          startTimer()
        }
      }

      function handleBlur() {
        // 窗口失去焦点，停止计时并上报
        console.log('[埋点] blur - 窗口失去焦点')
        reportStayTime('blur')
      }

      function handleFocus() {
        // 窗口获得焦点，开始新的计时
        console.log('[埋点] focus - 窗口获得焦点，开始新的计时')
        startTimer()
      }

      function handleBeforeUnload() {
        // 页面卸载前立即上报（不使用防抖）
        console.log('[埋点] beforeunload - 页面即将卸载')
        reportStayTime('beforeunload', true)
        cleanup()
      }

      function handlePageHide() {
        // 页面隐藏时立即上报（iOS Safari 更可靠，不使用防抖）
        console.log('[埋点] pagehide - 页面隐藏')
        reportStayTime('pagehide', true)
      }

      function handleDOMContentLoaded() {
        if (isPageVisible()) {
          startTimer()
        }
      }

      // 监听页面可见性变化
      document.addEventListener('visibilitychange', handleVisibilityChange)

      // 监听窗口失去/获得焦点
      window.addEventListener('blur', handleBlur)
      window.addEventListener('focus', handleFocus)

      // 页面加载完成后开始计时
      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', handleDOMContentLoaded)
      } else {
        if (isPageVisible()) {
          startTimer()
        }
      }

      // 页面卸载时上报
      window.addEventListener('beforeunload', handleBeforeUnload)

      // 兼容性：监听 pagehide 事件（iOS Safari 更可靠）
      window.addEventListener('pagehide', handlePageHide)
    })()

    // ==================== 原有功能代码 ====================

    function adjustRem() {
      const pcBaseWidth = 375 // 设计稿
      const width = document.documentElement.clientWidth
      document.documentElement.style.fontSize = `${(width / pcBaseWidth * 100).toFixed(2)}px`
    }


    // 移动端检测和按钮隐藏逻辑
    function checkAndHideButtonOnMobile() {
      const isMobile = getIsMobile()
      if (isMobile) {
        adjustRem()
      }
      const iframeContainer = document.querySelector('.iframe-container');

      // 移动端时给iframe-container添加类名，否则移除类名
      if (iframeContainer) {
        if (isMobile) {
          iframeContainer.classList.add('mobile');
        } else {
          iframeContainer.classList.remove('mobile');
        }
      }
    }


    function handleResize() {
      // 响应式处理：重新检测移动端并处理按钮显示/隐藏
      checkAndHideButtonOnMobile();

      // 在窗口大小变化时，重新应用移动端相关的逻辑
      const isMobile = getIsMobile()
      const iframeContainer = document.querySelector('.iframe-container');

      // 确保在resize时也能正确添加或移除mobile类
      if (iframeContainer) {
        if (isMobile) {
          iframeContainer.classList.add('mobile');
        } else {
          iframeContainer.classList.remove('mobile');
        }
      }
    }

    // 防止iframe内容溢出
    window.addEventListener('resize', handleResize);

    // 页面加载完成后执行移动端检测
    document.addEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);

    // 清理所有事件绑定的函数
    function clearAllEvents() {
      // 清除 resize 事件监听器
      window.removeEventListener('resize', handleResize);

      // 清除 DOMContentLoaded 事件监听器
      document.removeEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);
    }

    // 页面卸载时自动清理事件（可选）
    window.addEventListener('beforeunload', clearAllEvents);

  </script>
